site_name: prsr
site_description: Pull request self-review — GitHub-style diffs with line numbers, locally
site_url: https://bluesentinelsec.github.io/prsr/
repo_url: https://github.com/bluesentinelsec/prsr
repo_name: bluesentinelsec/prsr
edit_uri: edit/main/docs/
copyright: Inter and IBM Plex Mono under the SIL Open Font License 1.1.

theme:
  name: material
  palette:
    scheme: slate
    primary: black
    accent: amber
  font: false
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy
    - toc.follow

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Install: install.md
  - CLI: cli.md
  - Library: library.md
  - Review workflow: workflow.md
  - Contributing: contributing.md

markdown_extensions:
  - toc:
      permalink: true
  - tables
  - fenced_code
  - admonition
