[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prsr"
dynamic = ["version"]
description = "Pull request self-review: GitHub-style diffs with line numbers, locally"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [{ name = "bluesentinelsec" }]
keywords = ["github", "diff", "pull-request", "review", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control :: Git",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.5.0",
    "mypy>=1.8.0",
    "build>=1.0.0",
    "twine>=4.0.0",
]

[project.scripts]
prsr = "prsr.cli:main"

[project.urls]
Homepage = "https://github.com/bluesentinelsec/prsr"
Repository = "https://github.com/bluesentinelsec/prsr"
Issues = "https://github.com/bluesentinelsec/prsr/issues"
Changelog = "https://github.com/bluesentinelsec/prsr/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "prsr._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prsr = ["py.typed"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = ["-ra", "--strict-markers"]

[tool.coverage.run]
source = ["prsr"]
branch = true

[tool.ruff]
target-version = "py38"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
]
ignore = [
    "E501",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
# Type-check against 3.10+ (current mypy floor). Runtime support includes 3.8.
python_version = "3.10"
mypy_path = "src"
packages = ["prsr"]
strict = true
warn_unused_configs = true
show_error_codes = true
pretty = true
